<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chess Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class = "pointToWin"></div>
    <div class = "mainChessGame">
        <div class ="mainChessBox">
            <div class="chessBox">
               <!-- Dòng 1 -->
                <div class="square_white">
                    <div class="king">
                        <div class="king-crown"></div>
                        <div class="king-body"></div>
                      </div>
                      
                </div>
                <div class="square_pink">
                    <div class="chess-piece">
                        <div class="body"></div>
                        <div class="base"></div>
                        <div class="crown"></div>
                        <div class="cross-vertical"></div>
                        <div class="cross-horizontal"></div>
                    </div>
                </div>
                <div class="square_white"></div>
                <div class="square_pink"></div>
                <div class="square_white"></div>
                <div class="square_pink"></div>
                <div class="square_white"></div>
                <div class="square_pink"></div>

                <!-- Dòng 2 -->
                <div class="square_pink"></div>
                <div class="square_white"></div>
                <div class="square_pink"></div>
                <div class="square_white"></div>
                <div class="square_pink"></div>
                <div class="square_white"></div>
                <div class="square_pink"></div>
                <div class="square_white"></div>

                <!-- Dòng 3 -->
                <div class="square_white"></div>
                <div class="square_pink"></div>
                <div class="square_white"></div>
                <div class="square_pink"></div>
                <div class="square_white"></div>
                <div class="square_pink"></div>
                <div class="square_white"></div>
                <div class="square_pink"></div>

                <!-- Dòng 4 -->
                <div class="square_pink"></div>
                <div class="square_white"></div>
                <div class="square_pink"></div>
                <div class="square_white"></div>
                <div class="square_pink"></div>
                <div class="square_white"></div>
                <div class="square_pink"></div>
                <div class="square_white"></div>

                <!-- Dòng 5 -->
                <div class="square_white"></div>
                <div class="square_pink"></div>
                <div class="square_white"></div>
                <div class="square_pink"></div>
                <div class="square_white"></div>
                <div class="square_pink"></div>
                <div class="square_white"></div>
                <div class="square_pink"></div>

                <!-- Dòng 6 -->
                <div class="square_pink"></div>
                <div class="square_white"></div>
                <div class="square_pink"></div>
                <div class="square_white"></div>
                <div class="square_pink"></div>
                <div class="square_white"></div>
                <div class="square_pink"></div>
                <div class="square_white"></div>

                <!-- Dòng 7 -->
                <div class="square_white"></div>
                <div class="square_pink"></div>
                <div class="square_white"></div>
                <div class="square_pink"></div>
                <div class="square_white"></div>
                <div class="square_pink"></div>
                <div class="square_white"></div>
                <div class="square_pink"></div>

                <!-- Dòng 8 -->
                <div class="square_pink"></div>
                <div class="square_white"></div>
                <div class="square_pink"></div>
                <div class="square_white"></div>
                <div class="square_pink"></div>
                <div class="square_white"></div>
                <div class="square_pink"></div>
                <div class="square_white"></div>
        </div>

        </div>
        <div class="mainPlayer">
            <div class="character">
                <div class="character_name"></div>
                <div class="character_age"></div>
                <div class="character_customColors"></div>
            </div>
            <div class="time"></div>
            <div class="character">
                <div class="character_name"></div>
                <div class="character_age"></div>
                <div class="character_customColors"></div>
            </div>

        </div>
    </div>
    <div class = "setting_control">
        <div class="play"></div>
        <div class="pause"></div>
        <div class="undo"></div>
    </div>
</body>
</html>
